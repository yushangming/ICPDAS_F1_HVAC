function vGaps(){
  const st=gapState(),gc=gapCounts();
  const pct=gc.total?Math.round(gc.done/gc.total*100):0;
  const grps=GAPS.map(g=>{
    let done=0;
    const items=g.items.map((it,i)=>{
      const id=g.g+"|"+i,on=!!st[id];if(on)done++;
      return `<label class="gap-item ${on?'done':''}"><input type="checkbox" ${on?'checked':''} onchange="toggleGap('${id}')"><span class="t">${esc(it)}</span></label>`;
    }).join("");
    const gp=Math.round(done/g.items.length*100);

  ${grps}`;
}

/* ---- render ---- */
function route(){const h=location.hash.replace("#","")||"overview";return NAVDEF.some(n=>n[0]===h)?h:"overview";}
function render(){
  const r=route();
  $("#nav").innerHTML=navHTML(r);
  $("#mnav").innerHTML=mnavHTML(r);
  let html="";
  if(r==="overview")html=vOverview();
  else if(r==="timeline")html=vTimeline();
  else if(r==="problems")html=vProblems();
  else if(r==="gaps")html=vGaps();
  else if(r==="help")html=vHelp();
  else if(r==="partners")html=vPartners();
  else if(r==="baseline")html=vBaseline();
  else html=vStage(STAGES.find(s=>"s"+s.id===r));
  $("#app").innerHTML=html;
}
function renderKeep(inp){const pos=inp.selectionStart;render();const el=$("#app input[type=search]");if(el){el.focus();el.setSelectionRange(pos,pos);}}
window.addEventListener("hashchange",()=>{render();$(".main").scrollTop=0;window.scrollTo(0,0);});
render();
</script>
