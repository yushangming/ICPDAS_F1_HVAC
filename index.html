 ["🔑 兩階段驗收架構(2026-08-03 定案)","<p><b>為什麼要分階段</b>:7 台變頻器<b>在設備驗收前完全不投入</b>(現場手動起停、bypass),要等驗收完成、變頻器接手控制後才能調頻——這不只是承商的主張,泓格監控端自己的 <span class='kbd'>RPT-002</span> Rev.2.1 與 <span class='kbd'>OPS-002</span>(頻率階梯試驗排在「驗收後第一天」)也是同一個排程。<b>節能成效在設備驗收當下客觀上量不到。</b></p><div class='tblwrap'><table><tr><th>階段</th><th>判定範圍</th><th>前提</th><th>對應款項</th></tr><tr><td><b>一:設備/施工驗收</b></td><td>Punch List A~E 類(🔴 9 項全數關閉)</td><td>與變頻策略無關,可立即進行</td><td>依合約 §18/§20 辦理,惟建議保留能效驗證保留款</td></tr><tr><td><b>二:能效成果認定</b></td><td>Punch List F-1(🔵 2 項)</td><td>驗收完成 → 變頻器投入 → 執行 OPS-002 頻率階梯試驗 → 穩定運轉一段期間 → M&V</td><td>保留款於認定合格後支付</td></tr></table></div><p>🔑 <b>時程可分,責任不分</b>:承商主張「節能應與工程驗收分別」在<b>時程</b>上是對的,錯在想把<b>責任</b>一起分掉。合約附件一「系統總能效提升 30%」是成果承諾,不因分階段而免除。</p><div class='note'><b>🔴 分階段的前提是先補上擔保</b>:合約全文<b>無履約保證金</b>,第四期尾款 1,045,800 元是唯一履約擔保;第一階段合格即觸發尾款,付訖後業主對能效即無擔保。故 Punch List <b>G-5</b> 要求<b>驗收前</b>書面約定:①能效驗證保留款(或等額擔保)②未達 30% 之處理(改善義務、期限、違約金或減價)③驗證期起訖與資料來源。</div><div class='note' style='background:#EAF3F6;border-color:#BFD8E0;color:#15343E'><b>🛑 2026-08-24 前提變更(總經理與廠長共識)</b>:<b>第一階段驗收目標 2026 年 9 月底前完成,且不以能效達成 30% 為條件</b>——驗收依合約項目逐項點收、點收完就驗收;能效認定屬第二階段,<b>能效驗證期採 2026-10-01 ~ 11-30</b>(與基線期 2025-09~11 同季節配對,錯過今年下一個窗口是 2027 年 9 月)。理由是雙方為合作關係、可以驗收後繼續做驗證。<br><b>⚠ 這使 G-5 從「建議」變成「時間壓力」</b>:第一階段合格即觸發尾款,而能效認定要等到 11-30 之後,中間這段業主<b>完全無擔保</b>。而 2026-08-24 寄出的回函自 Rev.7.2 起<b>刻意移除商務與費用內容</b>(使用者裁示)→ <b>G-1/G-2/G-5 三項至今未向承商提出,須另循商務管道</b>。</div><p style='font-size:13.5px'><b>範本用法(給 SI)</b>:凡合約載有「性能保證」而該性能<b>須於驗收後才具備量測條件</b>者(節能、產能、良率),都應在驗收計畫裡先寫死這張表——分階段本身沒問題,<b>沒有分階段的擔保設計才是問題</b>。<b>而且擔保條款要跟驗收時程同時談定</b>:本案驗收時程一旦定在 9 月底,G-5 就從「驗收前應該做的事」變成「兩週內必須做完的事」。</p>"],

 extra:[["M&V 報告範本綱要(基線已完成,待報告期)","<ul class='tight'><li><b>方法</b>:建議 IPMVP Option B(改造系統隔離計量——本案已有完整水側感測與電表)或 Option C(全廠計量)。</li><li><b>基線期</b>:✅ 已完成(2026-07-12,Rev.7)——2025-09-01~11-30 修復後一階感測數據;正式基線為多元迴歸模型 B「日 kWh = 0.907×RT·h + 13.19×ECWT − 190.3」(R²=0.956;單變數模型 A 1.0118×RT·h+65.8 併列對照),雙軌節能量計算式已建立,見 <a href='#baseline'>10 能源基線</a>。</li><li>🛑 <b>報告期已定案:2026-10-01 ~ 11-30</b>(2026-08-20 決定、08-24 隨回函書面告知承商)。<b>為什麼只能是 9~11 月</b>:基線期是 2025-09-01~11-30,依 IPMVP 與 ASHRAE Guideline 14 須<b>同季節配對</b>;<b>不從 9/1 起算</b>是要留時間讓前置作業完成(變頻策略上線、OPS-002 階梯試驗、D-1/D-3 補正)。🔴 <b>錯過今年 9~11 月,下一個同季節窗口是 2027 年 9 月</b>——改用冬季或跨季節資料就必須跨季節外推,而基線報告已載明其不確定度為<b>逐月分塊 CV(RMSE) 約 15%</b>(非留一法的 9.4%),以「提升 30%」的標的而言會讓認定變得困難。⚠ 仍須以相同量測點與加權方式取得日 ECWT,否則只能退回模型 A。</li><li>🔴 <b>出報告前的六項缺口</b>(監控端 RPT-004 §6,2026-08-20):①<b>決定用哪一套模型</b>(一期模型 B 含 ECWT,對應合約標的 1.069;或退回對照模型 A)②<b>日 ECWT 的計算</b>(運轉有效分鐘的<b>負載加權平均</b>,工具已備但尚未納入例行計算)③<b>ECWT 校正口徑對齊</b>(見下方資料品質聲明)④<b>邊界書面約定</b>(旁通泵 <code>CHWBP01</code> 計不計入——該電表 2026-07 尚不存在)⑤<b>有效分鐘門檻統一為 RT&gt;5</b> ⑥驗證期起訖書面約定(✅ 08-24 已完成)。<b>前三項須在驗證期起算前完成。</b></li><li>🔴 <b>另一件必須寫進報告的事實:基線與現況不是同一個機位</b>——一期基線是<b>舊機</b> <code>Icemachine01</code>(峰值 118.9 kW),現況是 <b>CH-02 新機</b>(堃霖 160 RT,COMP01 變頻 + COMP02 定頻)。🔑 命名上也建議把監控端 2026 那個模型改稱「<b>改善後現況模型</b>」而非「基準模型」——在驗收語境下「基線」專指改善前,沿用舊稱對承商解釋時必然混淆。</li><li><b>正規化因子</b>:外氣溫濕度、生產負載(SMT 投產狀態);⚠ 若 ECM 動到冷卻水側,不可直接以改善後 ECWT 代入模型 B 正規化。</li><li><b>KPI 與合約標的</b>:kW/RT ——<b>合約附件一載明預期成果「系統總能效提升 30%」:基線 1.069 → 目標約 0.748 kW/RT</b>(成效爭議時之合約依據);冰機 COP(新機標稱 COP 5.7 ≈ 0.617 kW/RT,改善前主機基線 0.732)、水泵/水塔單位耗電、月用電與電費(同月年對比);合約另載「改善辦公室冷度不均」「解決冷卻水管路漏水」亦須於成果報告回應。</li><li><b>數據清洗聲明</b>:剔除異常值(如冷卻水流量 >400 渦流干擾)。</li><li><b>結論</b>:實際節能率 vs 初勘承諾值、回收年限實算。</li><li>這份報告同時是向其他客戶展示「泓格產品做節能監控」的最佳案例素材。</li></ul><p><b>🔴「提升 30%」的兩種口徑——驗收前必須書面確認採哪一種</b></p><div class='tblwrap'><table><tr><th>口徑</th><th>算法</th><th>初勘對應數字</th><th>加權方式</th></tr><tr><td><b>A 能效值改善</b></td><td>(1.067 − 0.75) ÷ 1.067</td><td class='num'><b>29.7%</b></td><td>IPLV 按<b>運轉時數</b>加權</td></tr><tr><td><b>B 年用電量減少</b></td><td>(改善前年 kWh − 改善後年 kWh) ÷ 改善前年 kWh</td><td class='num'><b>26.94%</b></td><td>按<b>電量</b>加權</td></tr></table></div><p style='font-size:13.5px'>兩者相差 <b>2.8 個百分點</b>,足以決定達標與否。合約附件一只寫「系統總能效提升 30%」未指明口徑;建議<b>以 A(能效值)為主判定、B 附帶揭露</b>——合約文字用的是「能效」,且 B 受生產負載變動影響,非承商可控。</p><p><b>⚠ 初勘報告內部數字不一致(引用時的勘誤)</b>:摘要引用 <b>1.032</b>、同頁明細與 p.10 之後一律為 <b>1.067</b>;經核算 1.067 才與附錄自洽,引用一律以 1.067 為準。另初勘的「三階段」與合約階段編號<b>不對應</b>,引用「第 N 階段」須指明出處。</p><p><b>🔑 達標路徑的驗算</b>(用於判斷「已達標」主張是否成立):依初勘自己的「還原系統」試算表,<b>只做水泵選型改善僅能達 0.807 kW/RT(改善 24.4%)</b> → 要達 30% <b>必須靠變頻策略</b>。因此「30% 已達標」與「變頻策略尚未撰寫」<b>不可能同時成立</b>;現況全頻 60 Hz 運轉等於把最大的節能手段關著再量測。</p><div class='note'><b>🔴 報告期取數之資料品質聲明</b>(監控平台側,2026-08-04 查明)——M&V 報告須載明以下分界並將跨界資料切開:<ul class='tight'><li><b>取樣密度變更</b>:2026-06-09 15:00 前為 5 分鐘取樣,之後 60 秒 → 30 秒。以「列數當分鐘」計算的<b>區段類/分布類統計會失真 5 倍</b>(總量類因分子分母同時縮放而抵消)。已實際造成一次誤判:短循環啟停 17.7 → <b>9.9 次/日</b>、停機區段中位 8 → <b>22 分</b>。</li><li><b>壓縮機 2 資料分界</b>:Node-RED 點表 adr 誤填(1000 應為 2000),15 欄中 14 欄長期讀到壓縮機 1 的暫存器;以堃霖廠測報告書點位表稽核 108 欄後於 <b>2026-08-04 21:02</b> 修正 → 該時點之前的壓縮機 2 資料不可用。</li><li>🔴🔴 <b>ECWT 校正會位移 M&V 結果——2026-08-20 警示回復,08-13 的降級作廢</b>。當時降級的理由是「冷卻水側溫度在基準能耗模型是<b>禁用特徵</b>」,但那講的是<b>監控端自己的 2026 現況模型</b>,而 <b>13.188 正是一期基線模型 B 的 ECWT 迴歸係數</b>——<b>拿 A 的性質回答了關於 B 的問題</b>(監控端 08-20 全庫 grep:<code>0.9071</code>／<code>13.188</code>／<code>模型 B</code> 命中數全部為 0,一期模型從未進過監控端的程式)。<b>現況</b>:承商 08-06 的校正值業主<b>不予採用</b>、<b>未設硬體 offset</b>,但監控端已在<b>查詢層施加 +0.60 °C</b>,而基線期用的是<b>舊機管路上的溫度計</b> → <b>0.6 °C ≈ 每日 7.9 kWh 的系統性偏移</b>,兩期不是同一量測基準。處理方式擇一:兩期用同一口徑重算,或退回模型 A 並在報告中聲明。<br>✅ <b>校正量本身已於 2026-09-01 定案</b>:以參考錶 DTM-385 對回塔溫度做原位比對(n=29、sd 0.014、涵蓋 24.7~32.2 °C 與停機/運轉兩態),<b>本廠讀低 +0.592 °C、修正型式為零點偏移</b>;與 RPT-001 一年前推得的 +0.60 只差 0.008,誤差帶 0.45~0.70 維持不動。⚠ 但這是<b>業主端</b>的定案,<b>承商側的 D-3 正式校正紀錄表仍待重做</b>(08-24 甲表 #5,期限 9 月中前)。</li><li>🔴 <b>2026-08-26 冰機供水設定點被改動 133 分鐘</b>:原廠技師為逼兩台壓縮機同時起動而調低設定點,復原時一度改成錯誤組合(兩段差溫由 2.0 變 1.0 °C)。供水溫每 +1 °C 冰機約省 2~3%(本廠 <b>1.6~2.4 kW</b>),<b>幅度大於 M&V 要解析的訊號</b>,而 <code>SUPPLY_SET01_TARGET</code> 從 07-07 起 1,194 個小時樣本<b>只有 10.0 一個值、零變異</b> → <b>歷史資料無從回歸估計</b>。已上線第 10 條告警 <code>setpoint-drift-001</code>;<b>驗證期內任何設定點異動須事前告知並書面記錄</b>。</li><li>⚠ <b>壓縮機電流 <code>COMP01_I</code>/<code>COMP02_I</code> 有大段假資料</b>:07-08/07-09/07-13 與 07-28~08-04 兩欄<b>位元 100% 相同</b>(非零而位元相同,物理上不可能),07-14~07-21、07-27 為部分污染;<b>07-22~07-25 與 08-05 起乾淨</b>。凡要區分兩台壓縮機分工的分析都須先排除。</li><li>🔴 <b>CH-02 PLC 資料凍結 6 天</b>:2026-08-04 21:27:30 ~ 08-10 09:0x,期間數值合理、不報錯、不中斷,但<b>全是凍結的假資料</b>(當時八條告警一條都沒響)→ 報告期取數須排除這段;已上線第 9 條告警 <code>data-frozen-001</code>。</li><li><b>CH01 為備用機</b>,全期 kW/流量/RT 為 0,PLC 通訊預計 2026-08 下旬測試;現行數字皆為 CH02 單機。</li></ul></div>"],

/* ---- 時程 ---- */
let tlFilter=0;
function vTimeline(){
  const chips=PERIODS.map((p,i)=>`<button class="chip ${tlFilter===i?'on':''}" onclick="tlFilter=${i};render()">${p}</button>`).join("");
  const evs=TL.filter(e=>tlFilter===0||e.p===tlFilter).map(e=>`
    <div class="ev ${e.m?'mile':''}"><span class="d">${e.d}</span><span class="pl">${PERIODS[e.p].split("(")[0]}</span><div>${esc(e.t)}</div></div>`).join("");
  return `<div class="eyebrow">Timeline</div><h1>工程時程</h1>
  <div class="sub">${TL.length} 個事件 · <span style="color:var(--amber)">●</span> 橘點為關鍵里程碑</div>
  <div class="searchbar">${chips}</div>
  <div class="card"><div class="tl">${evs}</div></div>`;
}

/* ---- 問題 ---- */
let probQ="",probS="全部";
function vProblems(){
  const tags=["全部",...new Set(PROBS.map(p=>p.s))];
  const chips=tags.map(t=>`<button class="chip ${probS===t?'on':''}" onclick="probS='${t}';render()">${t}</button>`).join("");
  const list=PROBS.map((p,i)=>({...p,i})).filter(p=>(probS==="全部"||p.s===probS)&&(!probQ||(p.q+p.w+p.f).includes(probQ)));
  const cards=list.map(p=>`
   <div class="card prob"><h3>#${p.i+1} ${esc(p.q)} <span class="b stage">${p.s}</span></h3>
   <div class="row"><div class="lab">原因</div><div>${esc(p.w)}</div><div class="lab">解決</div><div>${esc(p.f)}</div></div></div>`).join("")||`<div class="card">沒有符合的結果。</div>`;
  return `<div class="eyebrow">Issues & Resolutions</div><h1>問題與解決方式</h1>
  <div class="sub">全案 ${PROBS.length} 項問題對照(出處:00_工程總結報告 §4)</div>
  <div class="searchbar"><input type="search" placeholder="搜尋問題、原因、解決方式…" value="${esc(probQ)}"
    oninput="probQ=this.value;renderKeep(this)">${chips}</div>${cards}`;
}

/* ---- 階段 ---- */
function vStage(s){
  const t=stageStats(s);
  const rows=s.docs.map(d=>`<tr><td class="num">${d[0]}</td><td><b>${esc(d[1])}</b></td><td>${ST[d[2]]}</td><td>${esc(d[3]||"")}</td></tr>`).join("");
  const extras=(s.extra||[]).map(([ti,html])=>`<details><summary>${ti}</summary><div class="inner">${html}</div></details>`).join("");

/* ---- 待補追蹤 ---- */
function vGaps(){
  const st=gapState(),gc=gapCounts();
  const pct=gc.total?Math.round(gc.done/gc.total*100):0;
  const grps=GAPS.map(g=>{
    let done=0;
    const items=g.items.map((it,i)=>{
      const id=g.g+"|"+i,on=!!st[id];if(on)done++;
      return `<label class="gap-item ${on?'done':''}"><input type="checkbox" ${on?'checked':''} onchange="toggleGap('${id}')"><span class="t">${esc(it)}</span></label>`;
    }).join("");
    const gp=Math.round(done/g.items.length*100);
    return `<div class="gap-grp"><div class="gh"><b>${g.g}</b><div class="bar"><i style="width:${gp}%"></i></div><span class="pct">${done}/${g.items.length}(${gp}%)</span></div>${items}</div>`;
  }).join("");
  return `<div class="eyebrow">Gap Tracker</div><h1>待補事項追蹤</h1>
  <div class="sub">結案前需補齊之文件與紀錄(出處:各階段文件「⚠ 需要補充」標記)。勾選狀態儲存於本機瀏覽器,重新發布網頁不會清除。</div>
  <div class="card"><div class="gh" style="display:flex;align-items:center;gap:12px"><b style="font-size:16px">整體進度</b><div class="bar"><i style="width:${pct}%"></i></div><span class="pct">${gc.done}/${gc.total}(${pct}%)</span></div></div>
  <div class="note"><b>結案前優先</b>:M&V 報告本體(改善前基線已於 2026-07-12 Rev.7 完成)、追加減帳總表與成本結算、Punch List 正式表、<b>TAB 報告(合約附件三已計價 100,000 元)</b>、二階正式驗收清單與保固起算通知。<br>2026-07-28 合約正本建檔後,03/04 兩組多項已可勾銷(項目文字已標註「✅ …可勾銷」);勾選狀態由您自行勾。<br>2026-08-02:06 組「連續 30 日運轉數據佐證」已因監控平台修復而具備產出條件;08 組末新增 1 項(監控平台維運交接文件),既有項目順序與勾選狀態不受影響。</div>
  ${grps}`;
}
function toggleGap(id){const st=gapState();if(st[id])delete st[id];else st[id]=1;localStorage.setItem(GAP_KEY,JSON.stringify(st));render();}

  <h3 style="font-size:15px;margin:18px 0 6px;color:var(--teal-dk)">🥇 2026-08-26 現場實測:機制定案</h3>

  <div class="card" style="background:#F7FAFB"><div style="font-family:ui-monospace,monospace;font-size:13.5px;line-height:2">
  閉合點 (cut-in)&nbsp; = RANGE &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; = <b>0.3 kgf/cm²</b><br>
  開路點 (cut-out) = RANGE − DIFF = 0.3 − 0.3 = <b>0</b></div>
  <div style="font-size:13px;color:var(--ink2)">(DIFF 刻度 0 = 型錄物理下限 0.3)</div></div>
  <p><b>與理頓 8/15「斷流跳脫點 DP = 0;啟動壓須達 0.3」完全吻合——現在是現場實測,不是轉述。</b>理頓轉寄的堃霖信另給出 PLC 判定參數:<b>壓差 &lt; 0.3 kg/cm² 且持續 &gt; 4 秒</b>。這一組設定<b>一次解釋四件事</b>:①啟動要 2~11 分鐘才閉合 = 等蒸發器壓差爬到 0.3 ②零水流 282 小時從未開路 = 開路點是 0 ③<code>RANGE</code> 往上調更容易跳 ④<b>方案 A(先開備用冰水泵)有效</b> = 提前把壓差推過 0.3。</p>
  <div class="note"><b>🔴🔴 推論出來的新事實,對變頻試車有直接影響</b><br>這個開關實質上只是<b>啟動許可,不是運轉中的斷流保護</b>——一旦閉合,只有壓差歸零才會開路。<b>變頻降頻時壓差掉到 0.3 以下,當下不會跳</b>;問題會延到<b>下一次啟動關不上</b>才出現,<b>試車當天的停止條件看不到它</b>。額定蒸發器壓差 0.4 vs 閉合點 0.3 → 裕度 0.1;壓差 ∝ 流量² → <b>流量降到 86.6% 就跌破</b>。<br>→ <code>REQ-003</code> 升 <b>Rev. 1.3</b>(2026-08-27,24 頁,⏳ 尚未寄出),新增三項請承商確認:<b>額定壓差與其對應額定流量</b>、階梯試車紀錄表增設「<b>蒸發器實際壓差</b>」欄、<b>Gate 2C／3 增加「停機後再啟動」的確認</b>。</div>
  <p>🔴 <b>我方同時更正自己的一項引用</b>:先前說的「壓差已達 1.2~1.4」是<b>泵浦</b>壓差,不是蒸發器壓差,<b>本廠沒有蒸發器壓差量測</b> → 更正後原本的矛盾不存在,<b>導壓管積氣假說不再主張</b>。🔴 仍缺 Saginomiya <b>使用說明</b>——<code>DIFF</code> 刻度「0」對應多少,只有使用說明說得準(型錄下限寫 0.3,刻度卻標到 0)。</p>
  <p style="margin-bottom:0">✅ <b>方案 A 首次有效測試成功</b>(2026-08-24):廠務先開備用冰水泵 5 分鐘,該次開關<b>全程未動作</b>。🔑 這件事差點被讀錯——我方原本把「今天開關沒跳」寫成「現象自己間歇消失」並已寫進要寄出的信,是使用者追問「有沒有同時開備用泵」才翻案。<b>資料看得到「發生了什麼」,看不到「有人做了什麼」。</b>⚠ 惟<b>僅此一次尚不足以認定方案 A 有效</b>,後續幾個週一會以相同方式記錄並提供承商。</p>
  </div></details>

  <h2>爭點一:節能驗證的方法與標的</h2>
  <div class="card">
  <p style="margin-top:0">承商主張「執行改善案並非使用 M&V 方式評估,是使用<b>附件方式</b>進行評估」——所指為 2024-10-31 初勘報告附錄的 IPLV 加權試算表。經比對,<b>兩種方法收斂到同一個數字</b>:</p>
  <div class="tblwrap"><table>
  <tr><th>來源</th><th>改善前系統能效</th><th>目標(提升 30%)</th></tr>
  <tr><td>初勘報告附錄 IPLV 四點加權(承商自產)</td><td class="num">1.067 kW/RT</td><td class="num">0.75 → 改善 <b>29.7%</b></td></tr>
  <tr><td>泓格實測基線 Rev.7(2025-09~11 每分鐘資料)</td><td class="num">1.069 kW/RT</td><td class="num">0.748 → 改善 <b>30.0%</b></td></tr>
  </table></div>
  <p>兩者相差 <b>0.2%</b>。初勘所訂的「標準系統能效 0.75 kW/RT」相對 1.067 恰為 29.7% → <b>合約附件一的「系統總能效提升 30%」就是初勘的「達到 0.75 kW/RT」</b>。方法之爭其實不存在,兩套方法在改善前是互相驗證的。</p>
  </div>

  <details><summary>⚠ 引用初勘報告前必讀:兩處數字問題</summary><div class="inner">
  <p><b>① 摘要 1.032 與附錄明細 1.067 不一致。</b>p.9 表頭列 0.897 / 0.947 / 1.047 / 1.339 → 加權 1.032(摘要引用值),但同頁下方明細算出的是 0.897 / <b>0.959</b> / <b>1.086</b> / <b>1.458</b> → 加權 <b>1.067</b>(p.10 之後全部改用此值)。<b>明細版 1.067 才自洽</b>,且與泓格實測 1.069 幾乎一致。</p>
  <p><b>② 「提升 30%」有兩種口徑,差 2.8 個百分點。</b></p>
  <div class="tblwrap"><table><tr><th>口徑</th><th>算法</th><th>結果</th></tr>
  <tr><td><b>能效值改善</b>(kW/RT)</td><td>(1.067 − 0.75) / 1.067</td><td class="num"><b>29.7%</b></td></tr>
  <tr><td><b>年用電量減少</b></td><td>95,130 kWh / 353,082 kWh</td><td class="num"><b>26.94%</b></td></tr></table></div>
  <p>原因:IPLV 以<b>時數</b>加權(2.30% / 41.50% / 46.10% / 10.10%),節費以<b>電量</b>加權。合約文字為「系統總能效<b>提升</b>」→ 應採前者。<b>驗收前務必書面確認</b>,否則同一份資料會得出「達標」與「未達標」兩種結論。</p>
  <p style="margin-bottom:0">③ 報告自載免責:「數據估計誤差約在 10%……如需取得更精確數值則需使用精密儀器進一步測量」——承商自己就指出初勘方法不足以作為精確驗證依據,而精密量測正是一階感測建置與 <a href="#monitor">11 監控系統</a> 提供的。</p>
  </div></details>

  <h2>爭點二:改善前後資料是否具備</h2>
  <div class="card">
  <p style="margin-top:0">承商主張「如使用 M&V 方式,需要有效性及完整性的資料(如<b>至少每分鐘 1 筆</b>的改善前後記錄)」。<b>此點與事實不符</b>——泓格正好都有,這正是一階段感測建置的目的:</p>
  <ul class="tight">
  <li><b>改善前</b>:2025-09-01 ~ 11-30 每分鐘 InfluxDB 資料 → <a href="#baseline">能源基線報告 Rev.7</a>(n=72、R²=0.956、CV(RMSE) 9.26%、留一法 9.42%),依 ISO 50001/50006、IPMVP、ASHRAE Guideline 14、FEMP M&V v5.0 建立,經三輪外部 AI 交叉審查。</li>
  <li><b>改善後</b>:2026-04 起 Grafana / InfluxDB 持續記錄;<code>hvac_daily</code> 降採樣已建、kW/RT 斷寫 2026-07-11 已修復 → <a href="#monitor">11 監控系統</a>。</li>
  <li>另,<b>IPMVP 本不要求 1 分鐘資料</b>——日用電量 + 自變數即為標準 Option C。此門檻為承商自設。</li>
  </ul>
  <p style="margin-bottom:0">結論:<b>M&V 報告由泓格出具,不需承商撰寫</b>;需要承商提供的是運轉參數與控制策略文件。</p>
  </div>

  <h2>爭點三:變頻策略未撰寫(最關鍵)</h2>
  <div class="card" style="border-left:4px solid var(--amber)">
  <p style="margin-top:0">承商原文:「<b>變頻策略的部份尚未撰寫,走 M&V 的話,能效僅能使用全頻納入</b>」。這與監控端 <b>RPT-002 Rev.2.0</b> 的重大更正互相印證——<b>7 台變頻器早已裝好,只是設在 60 Hz</b>,第一順位節能措施因此改為「調既有變頻器頻率,零設備投資」。</p>
  <p>但這句話的後果承商沒說完:</p>
  <div class="tblwrap"><table>
  <tr><th>依據</th><th>數值</th><th>意義</th></tr>
  <tr><td>基線期泵浦占系統用電</td><td class="num">30.7%(涼季 46%)</td><td>輔機是節能主戰場</td></tr>
  <tr><td>初勘附錄:定頻輔機能效(泵+塔)</td><td class="num">100% 負載 0.168 → 50% <b>0.342</b> → 25% <b>0.699</b> kW/RT</td><td>低負載急遽惡化</td></tr>
  <tr><td>實際負載分布</td><td class="num">50% 佔 46.1%、75% 佔 41.5%</td><td>大部分時間都在惡化區</td></tr>
  <tr style="background:#FBF1E6"><td><b>初勘「還原系統」表(只做水泵正確選型)</b></td><td class="num"><b>0.807 kW/RT</b></td><td><b>對 1.067 僅改善 24.4% → 達不到 30%</b></td></tr>
  </table></div>
  <p>→ <b>「30% 已達標」與「變頻策略尚未撰寫」不可能同時成立。</b>全頻運轉等於把合約裡最大的節能手段關著再量測;在變頻策略完成並穩定運轉一段期間前,任何方法都驗不出 30%——<b>這對承商同樣不利</b>。</p>
  <div class="note" style="margin-bottom:0"><b>⚠ 2026-08-03 立場修正:改採「兩階段驗收」</b><br>
  初稿曾主張「變頻策略完成前不辦理驗收合格」。但泓格監控端的 <b>RPT-002 Rev.2.1</b> 與新增的 <b>OPS-002 變頻器頻率階梯試驗</b>已載明:<b>7 台變頻器在設備驗收前完全不投入,現場是手動起停、繞過變頻器</b>,頻率階梯試驗排定於「驗收後第一天」。也就是說<b>泓格自己的計畫也是先驗收、再調頻</b>——若照初稿寄出,承商只要指出這一點,該立場即不成立。<br><br>
  正確架構是<b>時程可分、責任不分</b>:
  <div class="tblwrap" style="margin-top:8px"><table>
  <tr><th style="width:150px">階段</th><th>判定範圍</th><th>前提</th></tr>
  <tr><td><b>一:設備/施工驗收</b></td><td>附件五清單 + 缺失表 A~E(🔴 9 項)</td><td>與變頻策略無關,可立即進行</td></tr>
  <tr><td><b>二:能效成果認定</b></td><td>合約附件一「提升 30%」(🔵 2 項)</td><td>驗收 → 變頻器投入 → OPS-002 頻率試驗 → 穩定運轉 → M&V</td></tr>
  </table></div>
  <p style="margin:8px 0 0">承商「應和工程驗收分別」在<b>時程</b>上是對的,他錯的是想把<b>責任</b>一起分掉。因合約無履約保證金,第一階段一旦驗收合格即觸發尾款,故<b>必須在第一階段驗收前書面約定能效驗證保留款與未達標處理方式</b>(G-5)——這是取代履約保證金的唯一辦法。</p>
  <p style="margin:10px 0 0"><b>🛑 2026-08-24 定案(總經理與廠長共識,已書面告知承商)</b>:<b>第一階段驗收目標 2026 年 9 月底前完成,且不以能效達成 30% 為條件</b>——理由是雙方為合作關係,<b>可以驗收後繼續做驗證</b>;<b>能效驗證期採 2026-10-01 ~ 11-30</b>。<br>🔴 <b>這使 G-5 從「建議」變成「時間壓力」</b>:9 月底驗收付訖到 11-30 能效認定之間,業主<b>完全無擔保</b>;而 08-24 寄出的回函自 Rev.7.2 起<b>刻意移除商務與費用內容</b>(使用者裁示)→ <b>G-1／G-2／G-5 三項至今未向承商提出,須另循商務管道</b>。</p>
  </div>
  </div>

/* ---- render ---- */
function route(){const h=location.hash.replace("#","")||"overview";return NAVDEF.some(n=>n[0]===h)?h:"overview";}
function render(){
  const r=route();
  $("#nav").innerHTML=navHTML(r);
  $("#mnav").innerHTML=mnavHTML(r);
  let html="";
  if(r==="overview")html=vOverview();
  else if(r==="timeline")html=vTimeline();
  else if(r==="problems")html=vProblems();
  else if(r==="gaps")html=vGaps();
  else if(r==="help")html=vHelp();
  else if(r==="partners")html=vPartners();
  else if(r==="baseline")html=vBaseline();
  else if(r==="monitor")html=vMonitor();
  else if(r==="dispute")html=vDispute();
  else html=vStage(STAGES.find(s=>"s"+s.id===r));
  $("#app").innerHTML=html;
}
function renderKeep(inp){const pos=inp.selectionStart;render();const el=$("#app input[type=search]");if(el){el.focus();el.setSelectionRange(pos,pos);}}
window.addEventListener("hashchange",()=>{render();$(".main").scrollTop=0;window.scrollTo(0,0);});
render();
